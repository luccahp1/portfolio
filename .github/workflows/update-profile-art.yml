name: Update profile art

# The portrait and the info card are static: they only change when the photo or
# the copy changes, so they are regenerated by hand. Only the heatmap needs to
# stay alive, and it needs nothing but requests and beautifulsoup4.
"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/profile_config.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci] keeps the bot's own commit from re-triggering this
          # workflow through the push trigger above.
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "profile/data/contributions.json profile/contrib-heatmap.svg"
